name: vueprix-draft

# Required GitHub Actions secrets:
#   KEEPA_API_KEY
#   PAAPI_ACCESS_KEY, PAAPI_SECRET_KEY, PAAPI_PARTNER_TAG
#   ANTHROPIC_API_KEY
#   NOTION_API_KEY, NOTION_VUEPRIX_DATA_SOURCE_ID
#   NOTION_VUEPRIX_GUIDELINES_DATA_SOURCE_ID (optional)
#
# X / Bluesky 投稿は bot-publish.yml (repository_dispatch) 側で実行する。
# 本 workflow は Notion DB に Status=pending_review の候補を書き込むだけ。

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without creating real drafts (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read   # post-history.jsonl は artifact upload するので write 権限は不要

concurrency:
  group: vueprix-draft
  cancel-in-progress: false

jobs:
  run-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run draft pipeline
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
          PAAPI_HOST: webservices.amazon.co.jp
          PAAPI_REGION: us-west-2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_VUEPRIX_DATA_SOURCE_ID: ${{ secrets.NOTION_VUEPRIX_DATA_SOURCE_ID }}
          NOTION_VUEPRIX_GUIDELINES_DATA_SOURCE_ID: ${{ secrets.NOTION_VUEPRIX_GUIDELINES_DATA_SOURCE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          LOG_LEVEL: info
        run: npm run draft

      # post-history.jsonl は artifact として upload する (旧 git auto-commit 方式を廃止)。
      # 理由: contents: write 権限を削るため + auto-commit による push race を排除。
      # 90 日 retention で監査ログ用途には十分。長期解析が必要になったら別途集約 job を追加する。
      #
      # post-history.jsonl は audit-only。重複除去は Notion DB の queryDuplicateAsins
      # が SoT のため、cross-run 継続性は不要。各 run の artifact は独立 snapshot で
      # 90 日保持する設計 (PR-2 で git commit から artifact upload に移行)。
      - name: Upload post-history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-history-${{ github.run_id }}
          path: data/post-history.jsonl
          retention-days: 90
          if-no-files-found: ignore
