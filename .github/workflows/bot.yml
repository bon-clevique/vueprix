name: vueprix-draft

# Required GitHub Actions secrets:
#   KEEPA_API_KEY
#   PAAPI_ACCESS_KEY, PAAPI_SECRET_KEY, PAAPI_PARTNER_TAG
#   ANTHROPIC_API_KEY
#   NOTION_API_KEY, NOTION_VUEPRIX_DATA_SOURCE_ID
#   NOTION_VUEPRIX_GUIDELINES_DATA_SOURCE_ID (optional)
#
# X / Bluesky 投稿は bot-publish.yml (repository_dispatch) 側で実行する。
# 本 workflow は Notion DB に Status=pending_review の候補を書き込むだけ。

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without creating real drafts (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write   # post-history.jsonl の auto-commit のため (将来 artifact 化したら read に降格可)

concurrency:
  group: vueprix-draft
  cancel-in-progress: false

jobs:
  run-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run draft pipeline
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
          PAAPI_HOST: webservices.amazon.co.jp
          PAAPI_REGION: us-west-2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_VUEPRIX_DATA_SOURCE_ID: ${{ secrets.NOTION_VUEPRIX_DATA_SOURCE_ID }}
          NOTION_VUEPRIX_GUIDELINES_DATA_SOURCE_ID: ${{ secrets.NOTION_VUEPRIX_GUIDELINES_DATA_SOURCE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          LOG_LEVEL: info
        run: npm run draft

      - name: Commit post-history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/post-history.jsonl
          if git diff --staged --quiet; then
            echo "no data/post-history.jsonl changes"
            exit 0
          fi
          git commit -m "chore: update post-history [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              echo "rebase failed (attempt $i)"
              git rebase --abort 2>/dev/null || true
              sleep 2
              continue
            fi
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), retrying"
            sleep 2
          done
          echo "push failed after 3 attempts" >&2
          exit 1
