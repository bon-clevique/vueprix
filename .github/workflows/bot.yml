name: vueprix-draft

# Required GitHub Actions secrets:
#   KEEPA_API_KEY
#   PAAPI_ACCESS_KEY, PAAPI_SECRET_KEY, PAAPI_PARTNER_TAG
#   NOTION_API_KEY, NOTION_VUEPRIX_DATA_SOURCE_ID, NOTION_FIXED_ASIN_DATA_SOURCE_ID
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET (固定ASIN 即投稿)
#   BSKY_IDENTIFIER, BSKY_PASSWORD (固定ASIN 即投稿)
#
# deals 経路: Notion DB に Status=backlog で候補を書き込み、Notion AI で人が文言を埋めて
# approved → bot-publish.yml (repository_dispatch) で投稿。
# 固定ASIN 経路: 紹介文を NOTION_FIXED_ASIN_DATA_SOURCE_ID DB から取得して X/Bluesky に即投稿、
# 同時に投稿文 DB に Status=posted で記録。

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:

permissions:
  contents: read   # post-history.jsonl は artifact upload するので write 権限は不要

concurrency:
  group: vueprix-draft
  cancel-in-progress: false

jobs:
  run-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run draft pipeline
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
          PAAPI_HOST: webservices.amazon.co.jp
          PAAPI_REGION: us-west-2
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_VUEPRIX_DATA_SOURCE_ID: ${{ secrets.NOTION_VUEPRIX_DATA_SOURCE_ID }}
          NOTION_VUEPRIX_RUN_LOG_DATA_SOURCE_ID: ${{ secrets.NOTION_VUEPRIX_RUN_LOG_DATA_SOURCE_ID }}
          NOTION_FIXED_ASIN_DATA_SOURCE_ID: ${{ secrets.NOTION_FIXED_ASIN_DATA_SOURCE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          LOG_LEVEL: info
        run: npm run draft

      # post-history.jsonl は artifact として upload する (旧 git auto-commit 方式を廃止)。
      # 理由: contents: write 権限を削るため + auto-commit による push race を排除。
      # 90 日 retention で監査ログ用途には十分。長期解析が必要になったら別途集約 job を追加する。
      #
      # post-history.jsonl は audit-only。重複除去は Notion DB の queryDuplicateAsins
      # が SoT のため、cross-run 継続性は不要。各 run の artifact は独立 snapshot で
      # 90 日保持する設計 (PR-2 で git commit から artifact upload に移行)。
      - name: Upload post-history artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-history-${{ github.run_id }}
          path: data/post-history.jsonl
          retention-days: 90
          if-no-files-found: ignore
